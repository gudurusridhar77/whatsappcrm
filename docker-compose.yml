services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: whatsappcrm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsappcrm
      POSTGRES_USER: ${DB_USERNAME:-whatsappcrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-whatsappcrm123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-whatsappcrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsappcrm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/whatsappcrm
      DB_USERNAME: ${DB_USERNAME:-whatsappcrm}
      DB_PASSWORD: ${DB_PASSWORD:-whatsappcrm123}
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong2024}
      UPLOAD_DIR: /app/uploads
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      # Web Push (VAPID). Generate with: npx web-push generate-vapid-keys
      # Leave blank to disable push (app still runs).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@crm.techtricky.com}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"

  # React Frontend + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In Docker, frontend calls API via Nginx proxy (same origin)
        REACT_APP_API_URL: ""
        REACT_APP_WS_URL: /ws
    container_name: whatsappcrm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Reload nginx every 6h so renewed certs are picked up without downtime
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # Certbot — auto-renews the Let's Encrypt certificate
  certbot:
    image: certbot/certbot
    container_name: whatsappcrm-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  uploads:
  # Pinned names so they match the volumes init-ssl.sh creates via `docker run`
  certbot-conf:
    name: certbot-conf
  certbot-www:
    name: certbot-www
